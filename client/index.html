            <label>Invoice No / Customer</label>
            <input v-model="splitInvSearch" class="fc" placeholder="Type invoice no or customer…" @input="srchSplitInv"/>
            <div v-if="splitInvResults.length" style="background:var(--bg2);border:1px solid var(--brd);border-radius:6px;margin-top:2px;max-height:140px;overflow:auto">
              <div v-for="inv in splitInvResults" :key="inv._id" @click="pickSplitInv(inv)" style="padding:7px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--brd)" class="row-hover">
                <span style="font-weight:600">{{inv.invoiceNo}}</span> — {{inv.customerName}} — <span class="cg">{{f(inv.paid)}}</span>
              </div>
            </div>
          </div>
          <div class="fl" style="flex:1">
            <label>Amount</label>
            <input v-model="splitParts[0].amount" type="number" step="0.01" class="fc" @blur="splitParts[0].amount=n(splitParts[0].amount)"/>
          </div>
        </div>
      </div>

      <!-- Part 2: Extra -->
      <div style="border:1px solid var(--brd);border-radius:8px;padding:12px;background:var(--bg2)">
        <div style="font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:8px">PART 2 — Extra charge</div>
        <div class="fr">
          <div class="fl" style="flex:2">
            <label>Type</label>
            <select v-model="splitParts[1].extraType" class="fc">
              <option value="reimbursement">Reimbursement (Transport / Cost passed on)</option>
              <option value="income">Income (User's own charge)</option>
            </select>
          </div>
          <div class="fl" style="flex:1">
            <label>Label</label>
            <select v-model="splitParts[1].label" class="fc">
              <option>Transport</option>
              <option>Labour</option>
              <option>Delivery</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="fl" style="margin-top:6px">
          <label>Amount</label>
          <input v-model="splitParts[1].amount" type="number" step="0.01" class="fc" @blur="splitParts[1].amount=n(splitParts[1].amount)"/>
        </div>
      </div>

      <!-- Running total -->
      <div style="margin-top:12px;padding:10px;border-radius:8px;text-align:center;font-size:14px;font-weight:600"
           :style="splitBalanced?'background:rgba(0,200,100,.12);color:var(--cg)':'background:rgba(200,60,60,.1);color:var(--cr)'">
        Parts total: {{f(splitTotal)}} / {{f(Math.abs(reconActiveLine?.amount||0))}}
        {{splitBalanced?' ✓':' — amounts must balance'}}
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-o" @click="mReconSplit=false">Cancel</button>
      <button class="btn btn-p" @click="saveSplit" :disabled="saving||!splitBalanced">{{saving?'Saving…':'Confirm Split'}}</button>
    </div>
  </div>
</div>

<!-- RECON: BANK FEE / INTEREST MODAL -->
<div class="mo" v-if="mReconBankOnly" @click.self="mReconBankOnly=false">
  <div class="md" style="max-width:400px">
    <div class="mh">
      <div>
        <h3>Book &amp; Reconcile</h3>
        <div v-if="reconActiveLine" style="font-size:11px;color:var(--tx2)">
          {{fd(reconActiveLine.date)}} &nbsp;·&nbsp; <span :class="reconActiveLine.direction==='credit'?'cg':'cr'">{{reconActiveLine.direction==='credit'?'+':'-'}}{{f(Math.abs(reconActiveLine.amount))}}</span>
        </div>
      </div>
      <button class="xbtn" @click="mReconBankOnly=false">×</button>
    </div>
    <div class="mb">
      <div v-if="mErr" class="al al-d">{{mErr}}</div>
      <div class="al al-i" style="margin-bottom:10px;font-size:12px">This line has no matching record in StoreOS. Book it directly and reconcile in one step.</div>
      <div class="fg">
        <div class="fl">
          <label>Category</label>
          <select v-model="bankOnlyKind" class="fc">
            <option value="expense">Bank charge / fee (money out)</option>
            <option value="income">Interest income (money in)</option>
          </select>
        </div>
        <div class="fl">
          <label>Label / Account Name</label>
          <input v-model="bankOnlyLabel" class="fc" placeholder="e.g. Bank Charges, Interest Income…"/>
        </div>
        <div class="fl">
          <label>Amount</label>
          <input :value="f(Math.abs(reconActiveLine?.amount||0))" class="fc" disabled/>
        </div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-o" @click="mReconBankOnly=false">Cancel</button>
      <button class="btn btn-p" @click="saveBookBankOnly" :disabled="saving||!bankOnlyLabel">{{saving?'Saving…':'Book &amp; Reconcile'}}</button>
    </div>
  </div>
</div>

</div><!-- end #app -->


<!-- Vue 3 — synchronous load guarantees Vue is defined before app script -->

</body>
</html>
