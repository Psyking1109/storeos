<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StoreOS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0f14;--sur:#13161e;--sur2:#1a1e29;--brd:#252b3b;--brd2:#2e3547;
--acc:#f0a500;--grn:#27c07a;--red:#e05252;--blu:#4d9de0;--pur:#9d7fe3;--org:#e07040;
--txt:#e8eaf0;--tx2:#8b91a8;--tx3:#555e78;
--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;--r:8px}
[data-theme="light"]{--bg:#f0f2f7;--sur:#ffffff;--sur2:#f7f8fc;--brd:#dde1ec;--brd2:#c8cfe0;
--acc:#e09500;--grn:#1aaa66;--red:#d44;--blu:#2f7ec7;--pur:#7a5fd4;--org:#c05820;
--txt:#1a1e2e;--tx2:#4a5270;--tx3:#8892b0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
/* LOGIN */
.lw{flex:1;display:flex;align-items:center;justify-content:center}
.lb{background:var(--sur);border:1px solid var(--brd2);border-radius:14px;padding:40px 36px;width:380px;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.lb h1{font-family:var(--fh);font-size:28px;color:var(--acc);margin-bottom:4px}
.lb .sub{font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:2px;margin-bottom:28px}
/* SIDEBAR */
.sb{width:224px;min-width:224px;background:var(--sur);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:16px 14px 12px;border-bottom:1px solid var(--brd)}
.sb-logo h1{font-family:var(--fh);font-size:19px;color:var(--acc)}
.sb-logo span{font-size:9px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:2px}
.ns{padding:9px 8px 3px}
.nl{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--tx3);padding:0 8px 5px;font-family:var(--fm)}
.ni{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:var(--r);color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;user-select:none}
.ni:hover{background:var(--sur2);color:var(--txt)}.ni.active{background:rgba(240,165,0,.12);color:var(--acc)}
.ni .ic{font-size:14px;width:19px;text-align:center}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-family:var(--fm)}
.sb-foot{margin-top:auto;padding:10px;border-top:1px solid var(--brd)}
.upill{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r);background:var(--sur2);cursor:pointer}
.upill:hover{background:var(--brd2)}
.uav{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#000;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-family:var(--fm);flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:.5px}
.rbadge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-family:var(--fm);font-weight:600;text-transform:uppercase}
.r-admin{background:rgba(224,82,82,.2);color:var(--red)}.r-manager{background:rgba(240,165,0,.15);color:var(--acc)}
.r-cashier{background:rgba(39,192,122,.12);color:var(--grn)}.r-viewer{background:rgba(139,145,168,.12);color:var(--tx2)}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--sur);border-bottom:1px solid var(--brd);padding:0 20px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar h2{font-family:var(--fh);font-size:17px}
.tba{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{flex:1;overflow-y:auto;padding:18px 20px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:var(--fb);white-space:nowrap}
.btn-p{background:var(--acc);color:#000}.btn-p:hover{background:#ffc200}
.btn-o{background:transparent;border:1px solid var(--brd2);color:var(--tx2)}.btn-o:hover{border-color:var(--acc);color:var(--acc)}
.btn-d{background:rgba(224,82,82,.15);color:var(--red);border:1px solid rgba(224,82,82,.3)}.btn-d:hover{background:rgba(224,82,82,.25)}
.btn-g{background:rgba(39,192,122,.15);color:var(--grn);border:1px solid rgba(39,192,122,.3)}.btn-g:hover{background:rgba(39,192,122,.25)}
.btn-b{background:rgba(77,157,224,.15);color:var(--blu);border:1px solid rgba(77,157,224,.3)}.btn-b:hover{background:rgba(77,157,224,.25)}
.btn-sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}
/* CARDS */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:10px}
.ch{padding:13px 16px 10px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px}
.ch h3{font-family:var(--fh);font-size:14px}
.cb{padding:13px 16px}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:18px}
.sc{background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc.y::before{background:var(--acc)}.sc.g::before{background:var(--grn)}.sc.r::before{background:var(--red)}
.sc.b::before{background:var(--blu)}.sc.p::before{background:var(--pur)}.sc.o::before{background:var(--org)}
.sl{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;font-family:var(--fm);margin-bottom:5px}
.sv{font-family:var(--fm);font-size:20px;font-weight:500}.sv.sm{font-size:15px}
.ss{font-size:11px;color:var(--tx3);margin-top:4px}
/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:8px 11px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);font-weight:500;border-bottom:1px solid var(--brd);white-space:nowrap}
tbody td{padding:9px 11px;border-bottom:1px solid var(--brd);color:var(--tx2);font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}
.mn{font-family:var(--fm)}
/* FORMS */
.fg{display:grid;gap:12px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{grid-template-columns:1fr 1fr 1fr}.fr4{grid-template-columns:repeat(4,1fr)}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:10px;color:var(--tx2);font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-family:var(--fm)}
.fc{background:var(--bg);border:1px solid var(--brd2);color:var(--txt);padding:7px 10px;border-radius:var(--r);font-family:var(--fb);font-size:13px;width:100%;transition:border-color .15s}
.fc:focus{outline:none;border-color:var(--acc)}.fc option{background:var(--sur2)}
select.fc{cursor:pointer}textarea.fc{resize:vertical;min-height:60px}
/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;font-family:var(--fm);text-transform:uppercase;letter-spacing:.5px}
.bpaid{background:rgba(39,192,122,.15);color:var(--grn)}.bpend{background:rgba(240,165,0,.15);color:var(--acc)}
.bpart{background:rgba(77,157,224,.15);color:var(--blu)}.bover,.bout{background:rgba(224,82,82,.15);color:var(--red)}
.bdrft{background:rgba(139,145,168,.15);color:var(--tx2)}.brcvd,.bin{background:rgba(39,192,122,.15);color:var(--grn)}
.blow{background:rgba(224,82,82,.15);color:var(--red)}.bok{background:rgba(39,192,122,.1);color:var(--grn)}
.bimp{background:rgba(77,157,224,.15);color:var(--blu)}.bloc{background:rgba(39,192,122,.1);color:var(--grn)}
.bact{background:rgba(39,192,122,.1);color:var(--grn)}.bina{background:rgba(139,145,168,.12);color:var(--tx3)}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.md{background:var(--sur);border:1px solid var(--brd2);border-radius:12px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.md-lg{max-width:1020px}.md-xl{max-width:1200px}.md-sm{max-width:460px}
.mh{padding:15px 18px 12px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mh h3{font-family:var(--fh);font-size:15px}
.mb{padding:18px;overflow-y:auto;flex:1}.mf{padding:12px 18px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.xbtn{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;padding:0 4px}.xbtn:hover{color:var(--txt)}
/* MISC */
.al{padding:9px 13px;border-radius:var(--r);font-size:13px;margin-bottom:12px}
.al-d{background:rgba(224,82,82,.12);border:1px solid rgba(224,82,82,.3);color:#f08080}
.al-s{background:rgba(39,192,122,.12);border:1px solid rgba(39,192,122,.3);color:var(--grn)}
.al-i{background:rgba(77,157,224,.12);border:1px solid rgba(77,157,224,.3);color:var(--blu)}
.al-w{background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.3);color:var(--acc)}
.tb{background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);padding:12px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.tr.tot{border-top:1px solid var(--brd);margin-top:5px;padding-top:8px;font-weight:700;font-size:15px}
.txbadge{display:inline-flex;align-items:center;gap:4px;background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.25);border-radius:4px;padding:2px 7px;font-size:11px;font-family:var(--fm);color:var(--acc);margin:2px}
.txbadge .rm{color:var(--red);margin-left:3px;cursor:pointer;font-weight:700}
.ibb{background:linear-gradient(135deg,rgba(77,157,224,.1),rgba(157,127,227,.1));border:1px solid rgba(77,157,224,.3);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--blu)}
.dvd{height:1px;background:var(--brd);margin:12px 0}
.tr{text-align:right}.tc{text-align:center}
.ca{color:var(--acc)}.cg{color:var(--grn)}.cr{color:var(--red)}.cb2{color:var(--blu)}.cm{color:var(--tx3)}.cp{color:var(--pur)}.co{color:var(--org)}
.fw{font-weight:700}.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.fx{display:flex;align-items:center}.fxb{display:flex;align-items:center;justify-content:space-between}
.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}
.emp{text-align:center;color:var(--tx3);padding:32px 16px;font-size:14px}
.emp .eic{font-size:30px;margin-bottom:8px;opacity:.4}
.iw{position:relative}.si{padding-left:30px!important}
.sch{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.srd{background:var(--bg);border:1px solid var(--brd2);border-radius:var(--r);max-height:160px;overflow-y:auto;margin-bottom:6px}
.sri{padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center}
.sri:hover{background:var(--sur2)}.sri:last-child{border-bottom:none}
.itbl{width:100%;border-collapse:collapse;margin-top:6px}
.itbl th{font-size:9px;text-transform:uppercase;color:var(--tx3);font-family:var(--fm);padding:4px 5px;letter-spacing:1px;border-bottom:1px solid var(--brd);text-align:left}
.itbl td{padding:4px 5px;border-bottom:1px solid var(--brd)}
.itbl tr:last-child td{border-bottom:none}.itbl .fc{padding:4px 6px;font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--brd);margin-bottom:14px}
.tab{padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.tab:hover{color:var(--tx2)}.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.rpt-tbl th,.rpt-tbl td{padding:9px 14px;border-bottom:1px solid var(--brd);white-space:nowrap}
.rpt-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);font-weight:500;background:rgba(255,255,255,.02)}
.rpt-tbl .col-desc{width:55%;text-align:left}
.rpt-tbl .col-num{width:22.5%;text-align:right;font-family:var(--fm);font-size:13px}
.rpt-tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

@media print{
  body{background:#fff!important;color:#000!important}
  .sidebar,.topbar,.tba,.btn,.mo,#no-print{display:none!important}
  .content{margin:0!important;padding:0!important}
  #inv-print-area{display:block!important}
  @page{margin:15mm;size:A4}
}
#inv-print-area{display:none}
.inv-preview{background:#fff;color:#000;font-family:'DM Sans',sans-serif;padding:20px;border-radius:8px;border:1px solid var(--brd2)}
</style>
  <!-- Vue 3 loads synchronously — must be in head, before body parses -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.13/vue.global.prod.min.js"></script>
  <script src="/app.js"></script>
</head>
<body>
<div id="app">

<!-- LOGIN -->
<div v-if="!tok" class="lw">
  <div class="lb">
    <h1>StoreOS</h1><div class="sub">Sri Lanka Edition &middot; v3.0</div>
    <div v-if="lerr" class="al al-d">{{lerr}}</div>
    <div class="fg">
      <div class="fl"><label>Username</label><input v-model="lf.u" class="fc" placeholder="admin" @keydown.enter="login" autofocus/></div>
      <div class="fl"><label>Password</label>
        <div style="position:relative">
          <input v-model="lf.p" :type="spwd?'text':'password'" class="fc" @keydown.enter="login" style="padding-right:36px"/>
          <span @click="spwd=!spwd" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--tx3)">{{spwd?'👁':'👁‍🗨'}}</span>
        </div>
      </div>
      <button class="btn btn-p" @click="login" :disabled="lding" style="width:100%;padding:10px;font-size:14px;justify-content:center">
        {{lding?'Signing in...':'Sign In'}}
      </button>
    </div>
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--brd);font-size:11px;color:var(--tx3);text-align:center;font-family:var(--fm)">Default: admin / admin123</div>
  </div>
</div>

<template v-else>
<!-- SIDEBAR -->
<nav class="sb">
  <div class="sb-logo" style="display:flex;align-items:flex-start;justify-content:space-between">
    <div><h1>StoreOS</h1><span>Sri Lanka Edition</span></div>
    <button @click="toggleTheme" style="background:none;border:1px solid var(--brd2);border-radius:16px;padding:3px 8px;cursor:pointer;font-size:13px;margin-top:4px;flex-shrink:0" title="Toggle theme">
      {{isDark?'☀️':'🌙'}}
    </button>
  </div>
  <div class="ns"><div class="nl">Main</div>
    <div class="ni" :class="{active:pg==='dash'}" @click="pg='dash'"><span class="ic">⬡</span>Dashboard</div>
  </div>
  <div class="ns"><div class="nl">Sales</div>
    <div class="ni" :class="{active:pg==='inv'}"  @click="pg='inv'"><span class="ic">📋</span>Invoices</div>
    <div class="ni" :class="{active:pg==='pro'}"  @click="pg='pro'"><span class="ic">📝</span>Proformas</div>
    <div class="ni" :class="{active:pg==='undel'}" @click="pg='undel'"><span class="ic">🚚</span>Undelivered</div>
    <div class="ni" :class="{active:pg==='cust'}" @click="pg='cust'"><span class="ic">👥</span>Customers</div>
  </div>
  <template v-if="can('manager')">
  <div class="ns"><div class="nl">Purchasing</div>
    <div class="ni" :class="{active:pg==='po'}"   @click="pg='po'"><span class="ic">🛒</span>Purchases</div>
    <div class="ni" :class="{active:pg==='sup'}"  @click="pg='sup'"><span class="ic">🏭</span>Suppliers</div>
  </div>
  </template>
  <div class="ns"><div class="nl">Stock</div>
    <div class="ni" :class="{active:pg==='stk'}"  @click="pg='stk'"><span class="ic">📦</span>Inventory<span v-if="lowStock>0" class="nbadge">{{lowStock}}</span></div>
    <div class="ni" :class="{active:pg==='cat'}"  @click="pg='cat'"><span class="ic">🏷</span>Categories</div>
  </div>
  <div class="ns"><div class="nl">Accounts</div>
    <div class="ni" :class="{active:pg==='cash'}" @click="pg='cash'"><span class="ic">💵</span>Cash Accounts</div>
    <div class="ni" :class="{active:pg==='exp'}"  @click="pg='exp'"><span class="ic">💸</span>Expenses</div>
    <template v-if="can('manager')">
    <div class="ni" :class="{active:pg==='bank'}" @click="pg='bank'"><span class="ic">🏦</span>Banking</div>
    <div class="ni" :class="{active:pg==='recon'}" @click="pg='recon'"><span class="ic">✅</span>Reconciliation</div>
    <div class="ni" :class="{active:pg==='chq'}"  @click="pg='chq'"><span class="ic">🧾</span>Cheques<span v-if="pendChq>0" class="nbadge">{{pendChq}}</span></div>
    <div class="ni" :class="{active:pg==='led'}"  @click="pg='led'"><span class="ic">📒</span>Ledger</div>
    <div class="ni" :class="{active:pg==='laccs'}" @click="pg='laccs';loadLedgerAccs()"><span class="ic">📋</span>Chart of Accounts</div>
    <div class="ni" :class="{active:pg==='tbal'}"  @click="pg='tbal';loadTrialBalance()"><span class="ic">⚖️</span>Trial Balance</div>
    <div class="ni" :class="{active:pg==='drpt'}" @click="pg='drpt'"><span class="ic">📊</span>Daily Report</div>
    <div class="ni" :class="{active:pg==='taxr'}" @click="pg='taxr'"><span class="ic">🧮</span>Tax Report</div>
    <div class="ni" :class="{active:pg==='taxm'}" @click="pg='taxm'"><span class="ic">📅</span>Monthly Tax</div>
    </template>
  </div>
  <div class="ns"><div class="nl">Setup</div>
    <div class="ni" :class="{active:pg==='invt'}" @click="pg='invt'"><span class="ic">🔢</span>Invoice Settings</div>
    <div class="ni" :class="{active:pg==='loc'}"  @click="pg='loc'"><span class="ic">🏪</span>Locations</div>
    <template v-if="can('manager')">
    <div class="ni" :class="{active:pg==='txrt'}" @click="pg='txrt'"><span class="ic">🏷</span>Tax Rates</div>
    <div class="ni" v-if="can('admin')" :class="{active:pg==='usr'}" @click="pg='usr'"><span class="ic">👤</span>Users</div>
    <div class="ni" v-if="can('admin')" :class="{active:pg==='cosettings'}" @click="pg='cosettings'"><span class="ic">🏢</span>Company</div>
    </template>
  </div>
  <div class="sb-foot">
    <div class="upill" @click="pg='prof'">
      <div class="uav">{{me?.name?.[0]?.toUpperCase()||'?'}}</div>
      <div style="flex:1;min-width:0"><div class="uname">{{me?.name}}</div><div class="urole"><span class="rbadge" :class="'r-'+me?.role">{{me?.role}}</span></div></div>
      <span style="color:var(--tx3);font-size:11px">⚙</span>
    </div>
  </div>
</nav>

<div class="main">

<!-- DASHBOARD -->
<template v-if="pg==='dash'">
  <div class="topbar"><h2>Dashboard</h2><div class="tba"><span class="mn cm" style="font-size:11px">{{tdate}}</span></div></div>
  <div class="content">
    <div class="sg">
      <div class="sc y"><div class="sl">Today Sales</div><div class="sv">{{f(dash.today?.sales?.total||0)}}</div><div class="ss">{{dash.today?.sales?.count||0}} invoices</div></div>

<!-- PRODUCT MODAL -->
<div class="mo" v-if="mProd" @click.self="mProd=false">
  <div class="md md-lg"><div class="mh"><h3>{{eProd._id?'Edit Product':'New Product'}}</h3><button class="xbtn" @click="mProd=false">×</button></div>
    <div class="mb">
      <div v-if="mErr" class="al al-d">{{mErr}}</div>
      <div class="fg">
        <!-- Name + SKU -->
        <div class="fr"><div class="fl"><label>Product Name *</label><input v-model="eProd.name" class="fc" placeholder="e.g. Pigment Blue"/></div><div class="fl"><label>SKU / Code</label><input v-model="eProd.sku" class="fc" placeholder="e.g. PB-001"/></div></div>

        <!-- Category (dropdown from saved + quick create) + Unit + Min Stock -->
        <div class="fr" style="grid-template-columns:1fr auto 1fr 1fr">
          <div class="fl"><label>Category</label>
            <select v-model="eProd.category" class="fc">
              <option value="">— Select —</option>
              <option v-for="c in savedCats" :key="c._id" :value="c.name">{{c.name}}</option>
            </select>
          </div>
          <div class="fl" style="padding-top:20px"><button class="btn btn-b btn-sm" @click="mCat=true" title="Create new category">+ Cat</button></div>
          <div class="fl"><label>Base Unit <span style="font-size:10px;color:var(--tx3)">(full unit)</span></label><input v-model="eProd.unit" class="fc" placeholder="bag, box, pcs"/></div>
          <div class="fl"><label>Min Stock Alert</label><input v-model="eProd.minStock" type="number" class="fc" placeholder="0" @blur="eProd.minStock=+eProd.minStock||0"/></div>
        </div>

        <!-- Prices (not mandatory) -->
        <div class="fr" style="grid-template-columns:1fr 1fr 1fr">
          <div class="fl"><label>Cost Price <span style="font-size:10px;color:var(--tx3)">(optional)</span></label><input v-model="eProd.costPrice" type="number" step="0.01" class="fc" placeholder="0" @blur="eProd.costPrice=+eProd.costPrice||0"/></div>
          <div class="fl"><label>Selling Price <span style="font-size:10px;color:var(--tx3)">(optional)</span></label><input v-model="eProd.sellingPrice" type="number" step="0.01" class="fc" placeholder="0" @blur="eProd.sellingPrice=+eProd.sellingPrice||0"/></div>
          <div class="fl"><label>Margin</label><div class="fc" style="background:var(--sur2);color:var(--acc);font-family:var(--fm)">{{eProd.costPrice&&eProd.sellingPrice?((( eProd.sellingPrice-eProd.costPrice)/eProd.costPrice)*100).toFixed(1):'-'}}%</div></div>
        </div>

        <!-- Loose selling config -->
        <div class="dvd"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <label style="font-size:13px;font-weight:600;color:var(--txt)">Loose Selling</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--tx2)">
            <input type="checkbox" v-model="eProd.allowLoose" style="width:14px;height:14px"/>
            Enable — sell in smaller quantities than the base unit
          </label>
        </div>
        <div v-if="eProd.allowLoose" style="background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);padding:12px;margin-bottom:8px">
          <div class="fr" style="grid-template-columns:1fr 1fr 1fr 1fr">
            <div class="fl"><label>Loose Unit <span style="font-size:10px;color:var(--tx3)">(e.g. kg, g, ml)</span></label><input v-model="eProd.looseUnit" class="fc" placeholder="kg"/></div>
            <div class="fl"><label>Conversion <span style="font-size:10px;color:var(--tx3)">(how many loose = 1 base)</span></label><input v-model="eProd.looseConversion" type="number" step="0.001" min="0.001" class="fc" placeholder="e.g. 25" @blur="eProd.looseConversion=+eProd.looseConversion||0"/></div>
            <div class="fl"><label>Loose Price <span style="font-size:10px;color:var(--tx3)">(per loose unit)</span></label><input v-model="eProd.looseSellingPrice" type="number" step="0.01" class="fc" :placeholder="eProd.looseConversion?(eProd.sellingPrice/eProd.looseConversion).toFixed(2):'auto'" @blur="eProd.looseSellingPrice=+eProd.looseSellingPrice||0"/></div>
            <div class="fl"><label>Example</label><div class="fc" style="background:var(--sur2);font-size:12px;color:var(--tx2)">1 {{eProd.unit||'base'}} = {{eProd.looseConversion||'?'}} {{eProd.looseUnit||'loose'}}</div></div>
          </div>
        </div>

        <!-- Default Taxes -->
        <div class="fl">
          <label>Default Taxes</label>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center">
            <span v-for="tc in (eProd.defaultTaxCodes||[])" :key="tc" class="txbadge">{{tc}}<span class="rm" @click="eProd.defaultTaxCodes=eProd.defaultTaxCodes.filter(x=>x!==tc)">×</span></span>
            <select @change="e=>{if(e.target.value&&!eProd.defaultTaxCodes.includes(e.target.value))eProd.defaultTaxCodes.push(e.target.value);e.target.value=''}" class="fc" style="width:130px;padding:3px 7px;font-size:12px">
              <option value="">+ Add Tax</option>
              <option v-for="t in txRates" :key="t.code" :value="t.code">{{t.code}} {{t.rate}}%</option>
            </select>
          </div>
        </div>

        <!-- Opening stock + Description -->
        <div class="fr" v-if="!eProd._id">
          <div class="fl"><label>Opening Stock</label><input v-model="eProd.stock" type="number" class="fc" placeholder="0" @blur="eProd.stock=+eProd.stock||0"/></div>
          <div class="fl"><label>Description</label><input v-model="eProd.description" class="fc" placeholder="Optional"/></div>
        </div>

        <!-- Location stock -->
        <template v-if="eProd._id&&locs.length">
          <div class="dvd"></div>
          <div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:8px">Stock by Location</div>
          <div v-for="(ls,li) in eProd.locationStock" :key="li" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

<!-- STOCK MODAL -->
<div class="mo" v-if="mStk" @click.self="mStk=false">
  <div class="md md-lg"><div class="mh"><h3>📦 Stock Management — {{eStk.product?.name}}</h3><button class="xbtn" @click="mStk=false">×</button></div>
    <div class="mb">
      <!-- Current stock summary -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);padding:10px 12px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:3px">Current Full Stock</div>
          <div style="font-family:var(--fm);font-weight:700;font-size:18px;color:var(--txt)">{{eStk.product?.stock||0}} <span style="font-size:13px;color:var(--tx2)">{{eStk.product?.unit}}</span></div>
        </div>
        <div v-if="eStk.product?.allowLoose" style="background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);padding:10px 12px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:3px">Current Loose Stock</div>
          <div style="font-family:var(--fm);font-weight:700;font-size:18px;color:var(--acc)">{{eStk.product?.looseStock||0}} <span style="font-size:13px;color:var(--tx2)">{{eStk.product?.looseUnit}}</span></div>
          <div style="font-size:10px;color:var(--tx3);margin-top:2px">1 {{eStk.product?.unit}} = {{eStk.product?.looseConversion}} {{eStk.product?.looseUnit}}</div>
        </div>
      </div>

      <!-- Adjustment type selector -->
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn" :class="eStk.adjMode==='full'?'btn-p':'btn-o'" @click="eStk.adjMode='full'" style="flex:1">
          Full Units ({{eStk.product?.unit}})
        </button>
        <button v-if="eStk.product?.allowLoose" class="btn" :class="eStk.adjMode==='loose'?'btn-p':'btn-o'" @click="eStk.adjMode='loose'" style="flex:1">
          Loose Units ({{eStk.product?.looseUnit}})
        </button>
        <button v-if="eStk.product?.allowLoose" class="btn" :class="eStk.adjMode==='both'?'btn-p':'btn-o'" @click="eStk.adjMode='both'" style="flex:1">
          Both Together
        </button>
      </div>

      <!-- FULL UNIT adjustment -->
      <div v-if="eStk.adjMode==='full'||eStk.adjMode==='both'" class="fg" style="margin-bottom:12px">
        <div v-if="eStk.adjMode==='both'" style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px">Full Units ({{eStk.product?.unit}})</div>
        <div class="fr">
          <div class="fl"><label>Adjustment (+/-)</label>
            <input v-model="eStk.adj" type="number" class="fc" :placeholder="'e.g. +10 add bags, -5 remove bags'"/>
          </div>
          <div class="fl"><label>New Stock will be</label>
            <div class="fc" style="background:var(--sur2);font-family:var(--fm);font-weight:700;font-size:16px;color:var(--acc)">
              {{(eStk.product?.stock||0)+n(eStk.adj)}} {{eStk.product?.unit}}
            </div>
          </div>
        </div>
        <div v-if="eStk.product?.allowLoose&&n(eStk.adj)!==0" style="font-size:11px;color:var(--tx3);margin-top:4px;padding:5px 8px;background:var(--sur2);border-radius:4px">
          💡 {{Math.abs(n(eStk.adj))}} {{eStk.product?.unit}} = {{Math.abs(n(eStk.adj)*eStk.product?.looseConversion)}} {{eStk.product?.looseUnit}}
        </div>
      </div>

      <!-- LOOSE UNIT adjustment -->
      <div v-if="eStk.adjMode==='loose'||eStk.adjMode==='both'" class="fg" style="margin-bottom:12px">
        <div v-if="eStk.adjMode==='both'" style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px">Loose Units ({{eStk.product?.looseUnit}})</div>
        <div class="fr">
          <div class="fl"><label>Loose Adjustment (+/-)</label>
            <input v-model="eStk.looseAdj" type="number" step="0.001" class="fc" :placeholder="'e.g. +5.5 add '+eStk.product?.looseUnit"/>
          </div>
          <div class="fl"><label>New Loose will be</label>
            <div class="fc" style="background:var(--sur2);font-family:var(--fm);font-weight:700;font-size:16px;color:var(--acc)">
              {{(eStk.product?.looseStock||0)+n(eStk.looseAdj)}} {{eStk.product?.looseUnit}}
            </div>
          </div>
        </div>
        <div v-if="n(eStk.looseAdj)!==0&&eStk.product?.looseConversion" style="font-size:11px;color:var(--tx3);margin-top:4px;padding:5px 8px;background:var(--sur2);border-radius:4px">
          💡 {{Math.abs(n(eStk.looseAdj))}} {{eStk.product?.looseUnit}} = {{(Math.abs(n(eStk.looseAdj))/eStk.product?.looseConversion).toFixed(3)}} {{eStk.product?.unit}}
        </div>
      </div>

      <div style="font-size:11px;color:var(--tx3);padding:7px 10px;background:var(--sur2);border-radius:4px;margin-bottom:4px">
        Use positive numbers to add stock, negative to remove. E.g. +5 bags received, -3 damaged.
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-o" @click="mStk=false">Cancel</button>
      <button class="btn btn-p" @click="saveStkAdj" :disabled="saving">{{saving?'Saving...':'Apply Adjustment'}}</button>
    </div>
  </div>
</div>

<!-- TAX RATE MODAL -->
<div class="mo" v-if="mTxRate" @click.self="mTxRate=false">
  <div class="md"><div class="mh"><h3>{{eTxRate._id?'Edit Tax Rate':'New Tax Rate'}}</h3><button class="xbtn" @click="mTxRate=false">×</button></div>
    <div class="mb">
      <div v-if="mErr" class="al al-d">{{mErr}}</div>
      <div class="fg">
        <div class="fr">
          <div class="fl"><label>Code * <span style="font-size:10px;color:var(--tx3)">(e.g. VAT, LEVY)</span></label><input v-model="eTxRate.code" class="fc" placeholder="VAT" style="text-transform:uppercase" :disabled="!!eTxRate._id"/></div>
          <div class="fl"><label>Rate (%) *</label><input v-model="eTxRate.rate" type="number" step="0.01" min="0" max="100" class="fc" placeholder="18" @blur="eTxRate.rate=+eTxRate.rate||0"/></div>
        </div>
        <div class="fl"><label>Name *</label><input v-model="eTxRate.name" class="fc" placeholder="e.g. Value Added Tax"/></div>
        <div class="fr" style="grid-template-columns:1fr 1fr 1fr">
          <div class="fl"><label>Type</label>
            <select v-model="eTxRate.type" class="fc">
              <option value="both">Both (Sales &amp; Purchases)</option>
              <option value="output">Output only (Sales)</option>
              <option value="input">Input only (Purchases)</option>
            </select>
          </div>
          <div class="fl"><label>Applies To</label>
            <select v-model="eTxRate.appliesTo" class="fc">
              <option value="all">All transactions</option>
              <option value="sales">Sales only</option>
              <option value="purchases">Purchases only</option>
              <option value="imports">Imports only</option>
            </select>
          </div>
          <div class="fl"><label>Creditable?</label>
            <select v-model="eTxRate.creditable" class="fc">
              <option :value="true">Yes — offsets output tax</option>
              <option :value="false">No — non-creditable cost</option>
            </select>
          </div>
          <div class="fl"><label>Paid by</label>
            <select v-model="eTxRate.businessTax" class="fc">
              <option :value="false">Customer — shown on invoice, added to total</option>
              <option :value="true">Business (you) — NOT on invoice, tracked for IRD only</option>
            </select>
            <div v-if="eTxRate.businessTax" style="margin-top:5px;padding:7px 10px;background:rgba(240,165,0,.07);border:1px solid rgba(240,165,0,.25);border-radius:var(--r);font-size:12px;color:var(--tx2)">
              This tax is <strong>not shown to the customer</strong> and does not change the invoice total. It is calculated on the net amount for your IRD records only. Example: SSCL on a 300,000 invoice (incl. VAT 18%) → net = 254,237 → SSCL = 3,178 → invoice stays 300,000 but you owe 3,178 to IRD.
            </div>
          </div>
        </div>
        <div class="fl"><label>Description</label><textarea v-model="eTxRate.description" class="fc" rows="2" placeholder="e.g. Standard VAT — creditable"></textarea></div>
        <!-- reducedBy: which taxes to subtract from base before calculating this tax -->
        <div class="fl">
          <label>Calculated on reduced base? <span style="font-size:10px;color:var(--tx3)">(subtract these tax amounts from the bill total first)</span></label>
          <div class="al al-i" style="font-size:12px;padding:7px 10px;margin-top:4px">
            <strong>How this works:</strong> The system first calculates all normal taxes, then for this tax subtracts the selected tax amounts from the line total before applying this rate.<br/>
            <strong>SSCL example:</strong> Invoice = 300,000 (inclusive of VAT 18%).<br/>
            Net = 300,000 &divide; 1.18 = 254,237. SSCL = 254,237 &times; 1.25% = 3,178.<br/>
            Total stays 300,000 (customer pays this). You pay SSCL 3,178 to IRD.
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center">
            <span v-for="code in (eTxRate.reducedBy||[])" :key="code" class="txbadge">−{{code}}<span class="rm" @click="eTxRate.reducedBy=eTxRate.reducedBy.filter(c=>c!==code)">×</span></span>
            <select @change="e=>{if(e.target.value&&!(eTxRate.reducedBy||[]).includes(e.target.value)){if(!eTxRate.reducedBy)eTxRate.reducedBy=[];eTxRate.reducedBy.push(e.target.value);}e.target.value=''}" class="fc" style="width:160px;padding:3px 7px;font-size:12px">
              <option value="">+ Subtract tax from base</option>
              <option v-for="t in allTxRates.filter(t=>t.code!==eTxRate.code&&t.active)" :key="t.code" :value="t.code">{{t.code}} — {{t.name}}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="mf"><button class="btn btn-o" @click="mTxRate=false">Cancel</button><button class="btn btn-p" @click="saveTxRate" :disabled="saving">{{saving?'Saving...':'Save Tax Rate'}}</button></div>
  </div>
</div>

<!-- CHEQUE STATUS MODAL -->
<div class="mo" v-if="mChqSts" @click.self="mChqSts=false">
  <div class="md md-sm"><div class="mh"><h3>Update Cheque — {{chqStsData.cheque?.chequeNo}}</h3><button class="xbtn" @click="mChqSts=false">×</button></div>
    <div class="mb"><div class="fg">
      <div class="fl" v-if="chqStsData.status==='deposited'||chqStsData.status==='cleared'"><label>Bank Account</label><select v-model="chqStsData.accountId" class="fc"><option value="">— Select Account —</option><option v-for="a in baccs" :key="a._id" :value="a._id">{{a.name}}</option></select></div>
      <div class="fl" v-if="chqStsData.status==='deposited'"><label>Deposit Date</label><input v-model="chqStsData.depositedDate" type="date" class="fc"/></div>
      <div class="fl" v-if="chqStsData.status==='cleared'"><label>Cleared Date</label><input v-model="chqStsData.clearedDate" type="date" class="fc"/></div>
    </div></div>
    <div class="mf"><button class="btn btn-o" @click="mChqSts=false">Cancel</button><button class="btn btn-p" @click="saveChqSts" :disabled="saving">Confirm</button></div>
  </div>
</div>


<!-- INVOICE MODAL (large) -->
<div class="mo" v-if="mInv" @click.self="mInv=false">
  <div class="md md-xl"><div class="mh"><h3>{{nInv.type==='proforma'?'New Proforma':'New Invoice'}}</h3><button class="xbtn" @click="mInv=false">×</button></div>
    <div class="mb">
      <div v-if="mErr" class="al al-d">{{mErr}}</div>
      <!-- Document Type Selector -->
      <div class="fl" style="margin-bottom:10px">
        <label>Document Type</label>
        <div style="display:flex;gap:8px">
          <button @click="nInv.type='proforma'" class="btn btn-sm" :class="nInv.type==='proforma'?'btn-p':'btn-o'">📝 Proforma</button>
          <button @click="nInv.type='invoice'" class="btn btn-sm" :class="nInv.type==='invoice'?'btn-p':'btn-o'">🧾 Invoice</button>
        </div>
        <div v-if="nInv.type!=='invoice'" style="font-size:11px;color:var(--tx3);margin-top:4px">
          This is a soft commitment — it won't affect stock levels or accounting until confirmed into an Invoice.
        </div>
      </div>
      <!-- Invoice Type + Number Preview -->
      <div class="fr" style="margin-bottom:10px">
        <div class="fl"><label>Invoice Type <span style="font-size:10px;color:var(--tx3)">(sets auto number)</span></label>
          <select v-model="nInv.invoiceType" @change="previewInvNo" class="fc">
            <option value="">— Standard (INV-XXXX) —</option>
            <option v-for="t in invTypes" :key="t._id" :value="t._id">{{t.name}}</option>
          </select>
        </div>
        <div class="fl"><label>Invoice No. (preview)</label><div class="fc" style="background:var(--sur2);font-family:var(--fm);color:var(--acc);font-size:13px">{{invNoPreview||'Auto on save'}}</div></div>
      </div>
      <!-- Header Row -->
      <div class="fr fr4" style="margin-bottom:10px">
        <div class="fl"><label>Customer</label><select v-model="nInv.customer" @change="onCustChange" class="fc"><option value="">Walk-in Customer</option><option v-for="c in custs" :key="c._id" :value="c._id">{{c.name}}</option></select></div>
        <div class="fl"><label>Date</label><input v-model="nInv.date" type="date" class="fc" @change="previewInvNo"/></div>
        <div class="fl"><label>Due Date</label><input v-model="nInv.dueDate" type="date" class="fc"/></div>
        <div class="fl"><label>Tax Mode</label><select v-model="nInv.taxInclusive" @change="calcInv" class="fc"><option :value="false">Tax Exclusive</option><option :value="true">Tax Inclusive</option></select></div>
      </div>
      <!-- Purchaser details (persisted, autofilled from customer) -->
      <div class="fr fr3" style="margin-bottom:10px">
        <div class="fl"><label>Purchaser TIN</label><input v-model="nInv.customerTin" class="fc" placeholder="Tax ID (auto-filled)"/></div>
        <div class="fl"><label>Purchaser Phone</label><input v-model="nInv.customerPhone" class="fc" placeholder="Phone (auto-filled)"/></div>
        <div class="fl"><label>Place of Supply</label><input v-model="nInv.placeOfSupply" class="fc" placeholder="e.g. Colombo"/></div>
      </div>
      <div class="fr" style="margin-bottom:10px">
        <div class="fl"><label>Purchaser Address</label><textarea v-model="nInv.customerAddress" class="fc" rows="1" placeholder="Address (auto-filled)"></textarea></div>
        <div class="fl"><label>Date of Delivery</label><input v-model="nInv.dateOfDelivery" type="date" class="fc"/></div>
      </div>
      <!-- Tax Invoice Toggle + TIN Banner + Invoice Type Tax Toggles -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
        <button @click="nInv.taxInvoice=!nInv.taxInvoice" class="btn" :class="nInv.taxInvoice?'btn-p':'btn-o'">
          {{nInv.taxInvoice?'🧾 TAX INVOICE':'📄 Standard Invoice'}}
        </button>
        <!-- Toggle-mode taxes from invoice type -->
        <template v-if="nInv.invTypeTaxConfig.length">
          <span style="font-size:11px;color:var(--tx3);font-family:var(--fm)">TAXES:</span>
          <template v-for="tc in nInv.invTypeTaxConfig.filter(t=>t.mode==='toggle')" :key="tc.taxCode">
            <button @click="toggleInvTypeTax(tc.taxCode)" class="btn btn-sm" :class="nInv.toggledTaxes[tc.taxCode]?'btn-p':'btn-o'" style="font-size:11px">
              {{tc.taxCode}} {{tc.rate}}% {{nInv.toggledTaxes[tc.taxCode]?'✓':'—'}}
            </button>
          </template>
          <template v-if="nInv.invTypeTaxConfig.filter(t=>t.mode==='always').length">
            <span style="font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:1px">Auto:</span>
            <span v-for="tc in nInv.invTypeTaxConfig.filter(t=>t.mode==='always')" :key="tc.taxCode" class="txbadge" style="cursor:default;background:rgba(39,192,122,.12);border-color:rgba(39,192,122,.3);color:var(--grn)">
              ✓ {{tc.taxCode}} {{tc.rate}}%
            </span>
          </template>
        </template>
      </div>
      <div v-if="nInv.taxInvoice&&nInv.customer" class="al al-w" style="margin-bottom:8px;padding:7px 12px;font-size:13px">
        <strong>{{nInv.customerName}}</strong>
        <span v-if="nInv.customerTin"> &mdash; TIN: <strong class="mn ca">{{nInv.customerTin}}</strong></span>
        <span v-else class="cr"> &mdash; No TIN on file for this customer</span>
      </div>
      <!-- Item Search -->
      <div style="display:flex;gap:8px;margin-bottom:7px">
        <div class="iw" style="flex:1"><span class="sch">🔍</span><input v-model="iSrch" class="fc si" placeholder="Search product to add..." @input="srchProds" @keydown.enter.prevent="addFirstProd"/></div>
        <button class="btn btn-o" @click="nInv.items.push({product:null,productName:'',sku:'',qty:1,unit:'pcs',unitPrice:0,taxLines:[],taxAmount:0,lineSubtotal:0,lineTotal:0})">+ Manual Line</button>
      </div>
      <!-- Search results dropdown -->
      <div v-if="iSrchLoading" style="padding:8px 12px;font-size:12px;color:var(--tx3);background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);margin-bottom:7px">
        Searching...
      </div>
      <div v-else-if="iSrch&&!iSrchRes.length&&iSrch.trim().length>1" style="padding:8px 12px;font-size:12px;color:var(--tx3);background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);margin-bottom:7px">
        No products found for "{{iSrch}}"
      </div>
      <div v-else-if="iSrchRes.length" class="srd" style="margin-bottom:7px;max-height:280px;overflow-y:auto">
        <div v-for="p in iSrchRes" :key="p._id" @click="addProdToInv(p)" class="sri" style="cursor:pointer">
          <div style="flex:1;min-width:0">
            <div style="font-weight:500;color:var(--txt)">{{p.name}}</div>
            <div style="font-size:10px;color:var(--tx3)">
              <span v-if="p.sku">SKU: {{p.sku}}</span>
              <span v-if="p.allowLoose" style="margin-left:6px;color:var(--acc)">Loose available</span>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="mn ca" style="font-weight:600">{{f(p.sellingPrice)}}</div>
            <div style="font-size:10px;color:var(--tx3)">
              Stock: {{p.stock}}{{p.allowLoose&&p.looseStock?' + '+p.looseStock+' '+p.looseUnit:''}}
            </div>
          </div>
        </div>
      </div>
      <!-- Items Table -->
      <div v-if="nInv.items.length" style="font-size:11px;color:var(--tx3);margin-bottom:4px;text-align:right">{{nInv.items.length}} item{{nInv.items.length!==1?'s':''}} · {{nInv.items.reduce((s,i)=>s+i.qty,0).toFixed(2)}} units total</div>
      <table class="itbl">
        <thead><tr><th>Product</th><th>Qty</th><th>Unit/Mode</th><th>Price</th><th>Taxes</th><th>Tax Amt</th><th>Line Total</th><th></th></tr></thead>
        <tbody>
          <tr v-for="(item,i) in nInv.items" :key="i">
            <td style="min-width:150px"><input v-model="item.productName" class="fc" placeholder="Item name"/></td>
            <td style="width:70px"><input v-model="item.qty" type="number" min="0" step="0.001" class="fc" @input="calcInv()" @blur="item.qty=+item.qty||0"/>
              <div v-if="nInv.type==='invoice'&&lineStockWarning(item)" style="font-size:10px;color:var(--red);margin-top:2px">⚠ {{lineStockWarning(item)}}</div>
            </td>
            <td style="width:100px">
              <div style="display:flex;gap:3px;align-items:center">
                <input v-model="item.unit" class="fc" placeholder="pcs" style="flex:1;min-width:0"/>
                <button v-if="item.allowLoose" @click="toggleLooseMode(item)" :class="item.looseMode?'btn btn-p btn-sm':'btn btn-o btn-sm'" style="padding:2px 5px;font-size:10px;white-space:nowrap" :title="item.looseMode?'Loose mode — per '+item.looseUnit:'Full unit mode — per '+item.baseUnit">{{item.looseMode?'Loose ('+item.looseUnit+')':'Full ('+item.baseUnit+')'}}</button>
              </div>
            </td>
            <td style="width:105px"><input v-model="item.unitPrice" type="number" step="0.01" min="0" class="fc" @input="calcInv()" @blur="item.unitPrice=+item.unitPrice||0;calcInv()"/></td>
            <td style="min-width:160px">
              <div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">
                <span v-for="(tl,ti) in item.taxLines" :key="ti" class="txbadge">{{tl.taxCode}} {{tl.rate}}%<span class="rm" @click="item.taxLines.splice(ti,1);calcInv()">×</span></span>
                <select @change="e=>{addTaxToLine(item,e.target.value);e.target.value=''}" class="fc" style="width:90px;padding:2px 5px;font-size:11px">
                  <option value="">+Tax</option>
                  <option v-for="t in txRates.filter(t=>t.appliesTo==='all'||t.appliesTo==='sales')" :key="t.code" :value="t.code">{{t.code}} {{t.rate}}%</option>
                </select>
              </div>
            </td>
            <td style="width:80px" class="mn cm">{{f(item.taxAmount||0)}}</td>
            <td style="width:90px" class="mn ca fw">{{f(item.lineTotal||0)}}</td>
            <td style="width:35px"><button class="btn btn-d btn-sm" @click="nInv.items.splice(i,1);calcInv()">×</button></td>
          </tr>
          <tr v-if="!nInv.items.length"><td colspan="8" style="text-align:center;color:var(--tx3);padding:14px;font-size:12px">Search or add items above</td></tr>
        </tbody>
      </table>
      <!-- Totals + Payment -->
      <div style="display:grid;grid-template-columns:1fr 280px;gap:16px;margin-top:14px">
        <div>
          <div class="fr" style="margin-bottom:10px">
            <div class="fl"><label>Payment Received</label><input v-model="nInv.paid" @input="calcInv()" @blur="nInv.paid=+nInv.paid||0" type="number" step="0.01" class="fc"/></div>
            <div class="fl"><label>Payment Mode</label><select v-model="nInv.paymentMode" class="fc"><option value="cash">Cash</option><option value="bank">Bank Transfer</option><option value="cheque">Cheque</option></select></div>
          </div>
          <div class="fr" style="margin-bottom:10px">
            <div class="fl" v-if="nInv.paymentMode==='cash'"><label>Cash Account</label><select v-model="nInv.cashAccount" class="fc"><option value="">— Select —</option><option v-for="a in cas" :key="a._id" :value="a._id">{{a.name}} ({{f(a.currentBalance)}})</option></select></div>
            <div class="fl" v-if="nInv.paymentMode==='bank'"><label>Bank Account</label><select v-model="nInv.bankAccount" class="fc"><option value="">— Select —</option><option v-for="a in baccs" :key="a._id" :value="a._id">{{a.name}}</option></select></div>
            <div class="fl" v-if="nInv.paymentMode==='cheque'"><label>Cheque No.</label><input v-model="nInv.chequeNo" class="fc"/></div>
            <div class="fl"><label>Discount</label><input v-model="nInv.discount" @input="calcInv()" @blur="nInv.discount=+nInv.discount||0" type="number" step="0.01" class="fc" placeholder="0"/></div>
          </div>
          <div class="fl"><label>Notes</label><textarea v-model="nInv.notes" class="fc" rows="2"></textarea></div>
        </div>
        <!-- TOTALS BOX -->
        <div class="tb">
          <div class="tr" style="display:flex;justify-content:space-between">
            <span>{{nInv.taxInclusive?'Price (tax-inclusive)':' Subtotal (excl. tax)'}}</span>
            <span style="font-family:var(--fm)">{{f(nInv.subtotal)}}</span>
          </div>
          <div class="tr" style="display:flex;justify-content:space-between" v-if="nInv.discount"><span>Discount</span><span class="mn cr">({{f(nInv.discount)}})</span></div>
          <!-- Standard invoice: show inline taxes -->
          <template v-if="!nInv.taxInvoice">
            <div v-for="(tl,i) in nInv.taxBreakdown" :key="i" style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="color:var(--org)">{{tl.taxCode}} ({{tl.rate}}%)<span v-if="tl.reducedBy&&tl.reducedBy.length" style="font-size:10px;color:var(--tx3);margin-left:4px">excl. {{tl.reducedBy.join('+')}}</span></span>
              <span style="font-family:var(--fm)">{{f(tl.amount)}}</span>
            </div>
          </template>
          <!-- Tax invoice: show block summary -->
          <template v-else>
            <div v-if="nInv.taxBreakdown.length" style="background:rgba(240,165,0,.06);border:1px solid rgba(240,165,0,.2);border-radius:var(--r);padding:8px 10px;margin:6px 0">
              <div style="font-size:10px;font-family:var(--fm);text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:5px">Tax Summary</div>
              <div v-for="(tl,i) in nInv.taxBreakdown" :key="i" style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
                <span>{{tl.taxCode}} @ {{tl.rate}}%<span v-if="tl.reducedBy&&tl.reducedBy.length" style="font-size:10px;color:var(--tx3);margin-left:4px">(on {{tl.reducedBy.map(c=>'excl.'+c).join(', ')}})</span></span>
                <span style="font-family:var(--fm)">{{f(tl.amount)}}</span>
              </div>
              <div class="tr" style="border-top:1px solid rgba(240,165,0,.2);margin-top:4px;padding-top:4px;font-weight:700;display:flex;justify-content:space-between"><span>Total Tax</span><span class="mn ca">{{f(nInv.taxAmount)}}</span></div>
            </div>
          </template>
          <div class="tr tot" style="display:flex;justify-content:space-between"><span>TOTAL</span><span class="mn ca">{{f(nInv.total)}}</span></div>
          <div v-if="nInv.businessTaxAmount" style="margin-top:5px;padding:5px 8px;background:rgba(139,145,168,.08);border-radius:4px;border:1px dashed var(--brd2)">
            <div style="font-size:10px;color:var(--tx3);font-family:var(--fm);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Your IRD liability (not in total)</div>
            <div v-for="tl in nInv.taxBreakdown.filter(t=>t.businessTax)" :key="tl.taxCode" style="display:flex;justify-content:space-between;font-size:12px">
              <span style="color:var(--tx3)">{{tl.taxCode}}</span><span style="font-family:var(--fm);color:var(--tx3)">{{f(tl.amount)}}</span>
            </div>
          </div>
          <div class="tr" style="margin-top:5px;display:flex;justify-content:space-between"><span>Paid</span><span class="mn cg">{{f(nInv.paid)}}</span></div>
          <div class="tr" style="display:flex;justify-content:space-between"><span class="cr">Balance Due</span><span class="mn cr">{{f(nInv.balance)}}</span></div>
        </div>
      </div>
    </div>
    <div class="mf">
      <button class="btn btn-o" @click="mInv=false">Cancel</button>
      <button class="btn btn-b" @click="showLivePreview=true;printInv={...nInv};printTpl='tax_lk';mPrintInv=true" title="Open live preview of this invoice">🔍 Preview</button>
      <button class="btn btn-p" @click="saveInv" :disabled="saving||!nInv.items.length">{{saving?'Saving...':(nInv.type==='proforma'?'Create Proforma':'Create Invoice')}}</button>
    </div>
  </div>
</div>

<!-- PURCHASE MODAL (large) -->
<div class="mo" v-if="mPO" @click.self="mPO=false">
  <div class="md md-xl"><div class="mh"><h3>{{nPO.purchaseType==='import'?'Import Purchase':'Local Purchase'}}</h3><button class="xbtn" @click="mPO=false">×</button></div>
    <div class="mb">
      <div v-if="mErr" class="al al-d">{{mErr}}</div>
      <div v-if="nPO.purchaseType==='import'" class="ibb">
        Import &mdash; Enter costs in foreign currency.
        <div style="display:flex;gap:8px;margin-left:auto">
          <div class="fl" style="margin:0"><label style="color:var(--blu)">Currency</label><input v-model="nPO.currency" class="fc" style="width:75px;padding:4px 7px"/></div>
          <div class="fl" style="margin:0"><label style="color:var(--blu)">1 {{nPO.currency||'USD'}} = LKR</label><input v-model="nPO.exchangeRate" type="number" step="0.01" class="fc" style="width:100px;padding:4px 7px" @input="calcPO" placeholder="300" @blur="nPO.exchangeRate=+nPO.exchangeRate||0"/></div>
        </div>
      </div>
      <div class="fr" style="margin-bottom:12px;grid-template-columns:1fr 1fr 1fr">
        <div class="fl"><label>Supplier</label><select v-model="nPO.supplier" @change="e=>{const s=supps.find(s=>s._id===nPO.supplier);nPO.supplierName=s?s.name:''}" class="fc"><option value="">— Select —</option><option v-for="s in supps" :key="s._id" :value="s._id">{{s.name}}</option></select></div>
        <div class="fl"><label>Date</label><input v-model="nPO.date" type="date" class="fc"/></div>
        <div class="fl"><label>Tax Mode</label><select v-model="nPO.taxInclusive" @change="calcPO" class="fc"><option :value="false">Tax Exclusive</option><option :value="true">Tax Inclusive</option></select></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:7px">
        <div class="iw" style="flex:1"><span class="sch">🔍</span><input v-model="poSrch" class="fc si" placeholder="Search product..." @input="srchProdsPO"/></div><button class="btn btn-b btn-sm" @click="openQuickProd()" style="margin-left:6px" title="Create new product without closing this form">+ New Item</button>
        <button class="btn btn-o" @click="nPO.items.push({product:null,productName:'',sku:'',qty:1,unit:'pcs',unitCostForeign:0,unitCost:0,taxLines:[],taxAmount:0,lineSubtotal:0,lineTotal:0})">+ Manual Line</button>
      </div>
      <div v-if="poSrchRes.length" class="srd" style="margin-bottom:7px">
        <div v-for="p in poSrchRes" :key="p._id" @click="addProdToPO(p)" class="sri"><span style="color:var(--txt)">{{p.name}}</span><span class="mn cm" style="font-size:10px">Cost: {{f(p.costPrice)}}</span></div>
      </div>
      <div style="overflow-x:auto">
        <table class="itbl">
          <thead>
            <tr v-if="nPO.purchaseType==='import'"><th>Product</th><th>Qty</th><th>Unit</th><th>Cost ({{nPO.currency||'USD'}})</th><th>Cost (LKR)</th><th>Tax Lines</th><th>Tax</th><th>Line (LKR)</th><th></th></tr>
            <tr v-else><th>Product</th><th>Qty</th><th>Unit</th><th>Unit Cost</th><th>Tax Lines</th><th>Tax Amt</th><th>Line Total</th><th></th></tr>
          </thead>
          <tbody>
            <tr v-for="(item,i) in nPO.items" :key="i">
              <td style="min-width:130px"><input v-model="item.productName" class="fc" placeholder="Item name"/></td>
              <td style="width:65px"><input v-model="item.qty" type="number" step="0.01" class="fc" @input="calcPO()" @blur="item.qty=+item.qty||0"/></td>
              <td style="width:55px"><input v-model="item.unit" class="fc" placeholder="pcs"/></td>
              <template v-if="nPO.purchaseType==='import'">
                <td style="width:110px"><input v-model="item.unitCostForeign" type="number" step="0.01" class="fc" @input="calcPO()" @blur="item.unitCostForeign=+item.unitCostForeign||0" placeholder="0"/></td>
                <td style="width:90px"><div class="fc" style="background:var(--sur2);font-family:var(--fm);font-size:12px;padding:4px 6px">{{f((item.unitCostForeign||0)*(nPO.exchangeRate||1))}}</div></td>
              </template>
              <template v-else>
                <td style="width:105px"><input v-model="item.unitCost" type="number" step="0.01" class="fc" @input="calcPO()" @blur="item.unitCost=+item.unitCost||0"/></td>
              </template>
              <td style="min-width:140px">
                <div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">
                  <span v-for="(tl,ti) in item.taxLines" :key="ti" class="txbadge">{{tl.taxCode}} {{tl.rate}}%<span class="rm" @click="item.taxLines.splice(ti,1);calcPO()">×</span></span>
                  <select @change="e=>{addTaxToPOLine(item,e.target.value);e.target.value=''}" class="fc" style="width:90px;padding:2px 5px;font-size:11px">
                    <option value="">+Tax</option>
                    <option v-for="t in txRates.filter(t=>t.appliesTo==='all'||t.appliesTo==='purchases')" :key="t.code" :value="t.code">{{t.code}} {{t.rate}}%</option>
                  </select>
                </div>
              </td>
              <td style="width:75px" class="mn cm">{{f(item.taxAmount||0)}}</td>
              <td style="width:90px" class="mn ca fw">{{f(item.lineTotal||0)}}</td>
              <td style="width:35px"><button class="btn btn-d btn-sm" @click="nPO.items.splice(i,1);calcPO()">×</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- Landing Costs -->
      <div style="margin-top:14px">

          <div class="tr tot" style="display:flex;justify-content:space-between"><span>TOTAL (LKR)</span><span class="mn ca">{{f(nPO.total)}}</span></div>

                <th style="padding:6px 9px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Description</th>
                <th style="padding:6px 9px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Mode/Ref</th>
                <th style="padding:6px 9px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--grn);font-family:var(--fm);border-bottom:1px solid var(--brd)">Amount</th>
                <th style="padding:6px 9px;border-bottom:1px solid var(--brd);width:30px"></th>
              </tr></thead>
              <tbody>
                <tr v-for="stage in (poDet.paymentStages||[])" :key="stage._id">
                  <td style="padding:7px 9px;border-bottom:1px solid var(--brd);font-family:var(--fm);font-size:11px;color:var(--tx3);white-space:nowrap">{{fd(stage.date)}}</td>

                  <td style="padding:7px 9px;border-bottom:1px solid var(--brd);font-size:11px">
                    <span class="badge bpend" style="font-size:9px">{{stage.paymentMode}}</span>
                    <span v-if="stage.reference" style="color:var(--tx3);font-family:var(--fm);font-size:10px;margin-left:4px">#{{stage.reference}}</span>
                  </td>
                  <td style="padding:7px 9px;border-bottom:1px solid var(--brd);text-align:right;font-family:var(--fm);font-weight:700;color:var(--grn)">{{f(stage.amount)}}</td>

                </tr>
              </tbody>
              <tfoot><tr style="background:rgba(255,255,255,.04)">

                <td style="padding:8px 9px;text-align:right;font-family:var(--fm);font-weight:700;font-size:15px;color:var(--grn)">{{f((poDet.paymentStages||[]).reduce((s,p)=>s+p.amount,0))}}</td>
                <td></td>
              </tr></tfoot>
            </table>
            <div v-else style="color:var(--tx3);font-size:12px;padding:8px;border:1px dashed var(--brd2);border-radius:var(--r);margin-bottom:8px">No payments yet.</div>
          </div>
          <!-- Add payment -->
          <div v-if="(poDet.balance||0)>0.01" style="background:var(--sur2);border:1px solid var(--brd2);border-radius:var(--r);padding:12px">
            <div style="font-size:12px;font-weight:600;color:var(--txt);margin-bottom:8px">+ Add Payment</div>
            <div class="fg">
              <div class="fr" style="grid-template-columns:1fr 1fr">
                <div class="fl"><label>Amount *</label><input v-model="newStage.amount" type="number" step="0.01" class="fc" :placeholder="'Bal: '+f(poDet.balance||0)" @blur="newStage.amount=+newStage.amount||0"/></div>
                <div class="fl"><label>Date</label><input v-model="newStage.date" type="date" class="fc"/></div>
              </div>
              <div class="fr" style="grid-template-columns:1fr 1fr">
                <div class="fl"><label>Type</label>
                  <select v-model="newStage.paymentMode" class="fc">
                    <option value="bank">Bank Transfer / TT</option>
                    <option value="cash">Cash</option>
                    <option value="cheque">Cheque</option>
                  </select>
                </div>
                <div class="fl"><label>Reference</label><input v-model="newStage.reference" class="fc" placeholder="TT ref / cheque no."/></div>
              </div>
              <div class="fl"><label>Description</label><input v-model="newStage.description" class="fc" placeholder="e.g. TT Payment, Advance, Final Balance"/></div>
              <div class="fl" v-if="newStage.paymentMode==='cash'"><label>Cash Account</label>
                <select v-model="newStage.cashAccount" class="fc">
                  <option value="">— Select —</option>
                  <option v-for="a in cas" :key="a._id" :value="a._id">{{a.name}} ({{f(a.currentBalance)}})</option>
                </select>
              </div>
              <div class="fl" v-if="newStage.paymentMode==='bank'"><label>Bank Account</label>
                <select v-model="newStage.bankAccount" class="fc">
                  <option value="">— Select —</option>
                  <option v-for="a in baccs" :key="a._id" :value="a._id">{{a.name}}</option>
                </select>
              </div>
              <button class="btn btn-p" @click="savePayStage" :disabled="saving||!newStage.amount">{{saving?'Saving...':'+Add Payment'}}</button>
            </div>
          </div>
          <div v-else class="al al-s" style="margin-top:4px">✓ Fully paid</div>
          <!-- Notes -->
          <div class="fl" style="margin-top:12px"><label>Notes</label>
            <textarea v-model="poDet.notes" class="fc" rows="2" :disabled="poDet.isFinalized" @blur="savePONotes"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="mf">
      <div style="font-size:12px;color:var(--tx3);flex:1">Balance: <span class="mn fw" :class="(poDet.balance||0)>0.01?'cr':'cg'">{{f(poDet.balance||0)}}</span></div>
      <button class="btn btn-o" @click="mPODetail=false">Close</button>
    </div>
  </div>
</div>

<!-- RETURN / CREDIT NOTE MODAL -->
<div class="mo" v-if="mReturn" @click.self="mReturn=false">
  <div class="md md-lg"><div class="mh">
    <div>
      <h3>Process Return — {{retInv.invoiceNo}}</h3>
      <div style="font-size:12px;color:var(--tx2);margin-top:2px">{{retInv.customerName}} &mdash; {{fd(retInv.date)}} &mdash; Original total: {{f(retInv.total)}}</div>
    </div>
    <button class="xbtn" @click="mReturn=false">×</button>
  </div>
  <div class="mb">
    <div v-if="mErr" class="al al-d">{{mErr}}</div>
    <div class="al al-i" style="margin-bottom:12px;font-size:12px">Select items and quantities to return. A credit note will be created and stock will be restocked automatically.</div>
    <div v-if="!retItems.length" class="al al-w">Every item on this invoice has already been fully returned.</div>
    <!-- Items to return -->
    <table v-else style="width:100%;border-collapse:collapse;margin-bottom:14px">
      <thead><tr style="background:rgba(255,255,255,.04)">
        <th style="padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Product</th>
        <th style="padding:8px 10px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Invoiced</th>
        <th style="padding:8px 10px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Unit Price</th>
        <th style="padding:8px 10px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Return Qty</th>
        <th style="padding:8px 10px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);font-family:var(--fm);border-bottom:1px solid var(--brd)">Return Value</th>
      </tr></thead>
      <tbody>
        <tr v-for="(item,i) in retItems" :key="i">
          <td style="padding:8px 10px;border-bottom:1px solid var(--brd);color:var(--txt);font-weight:500">{{item.productName}}</td>
          <td style="padding:8px 10px;border-bottom:1px solid var(--brd);text-align:right;font-family:var(--fm);color:var(--tx2)">{{item.invoicedQty}} {{item.unit}}</td>
          <td style="padding:8px 10px;border-bottom:1px solid var(--brd);text-align:right;font-family:var(--fm)">{{f(item.unitPrice)}}</td>
          <td style="padding:8px 10px;border-bottom:1px solid var(--brd);text-align:right">
            <input v-model="item.returnQty" type="number" min="0" :max="item.origQty" step="1" class="fc" style="width:80px;padding:4px 8px;text-align:right;font-family:var(--fm)" @input="calcReturnTotal" @blur="item.returnQty=Math.min(+item.returnQty||0,item.origQty)"/>
            <div style="font-size:10px;color:var(--tx3);margin-top:2px">max {{item.origQty}}</div>
          </td>
          <td style="padding:8px 10px;border-bottom:1px solid var(--brd);text-align:right;font-family:var(--fm);font-weight:700;color:var(--acc)">{{f(item.returnQty?(item.lineTotal/item.invoicedQty*item.returnQty):0)}}</td>
        </tr>
      </tbody>
      <tfoot>
        <tr style="background:rgba(255,255,255,.04)">
          <td colspan="4" style="padding:10px;font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx2);font-weight:700">Return Total</td>
          <td style="padding:10px;text-align:right;font-family:var(--fm);font-weight:700;font-size:16px;color:var(--acc)">{{f(retTotal)}}</td>
        </tr>
      </tfoot>
    </table>
    <!-- Reason + options -->
    <div class="fg">
      <div class="fl"><label>Reason for Return</label>
        <input v-model="retReason" class="fc" placeholder="e.g. Defective, Wrong item, Customer changed mind"/>
      </div>
      <div class="fr">
        <div class="fl"><label>Return Date</label><input v-model="retDate" type="date" class="fc"/></div>
        <div class="fl"><label>Restock Items?</label>
          <select v-model="retRestock" class="fc">
            <option :value="true">Yes — add back to inventory</option>
            <option :value="false">No — do not restock</option>
          </select>
        </div>
      </div>
    </div>
  </div>
  <div class="mf">
    <div style="font-size:12px;color:var(--tx3);flex:1">A credit note <strong>RET-{{retInv.invoiceNo}}</strong> will be created.</div>
    <button class="btn btn-o" @click="mReturn=false">Cancel</button>
    <button class="btn btn-d" @click="saveReturn" :disabled="saving||retTotal<=0">{{saving?'Processing...':' Process Return ('+f(retTotal)+')'}}</button>
  </div>
  </div>
</div>


<!-- INVOICE DETAIL MODAL -->

        <th style="padding:7px 10px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);font-family:var(--fm);border-bottom:1px solid var(--brd)">Qty</th>
        <th v-if="invDet.type==='invoice'" style="padding:7px 10px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--grn);font-family:var(--fm);border-bottom:1px solid var(--brd)">Delivered</th>
        <th v-if="invDet.type==='invoice'" style="padding:7px 10px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--org);font-family:var(--fm);border-bottom:1px solid var(--brd)">Pending</th>

        <tr v-for="item in (invDet.items||[])" :key="item.productName">

          <td v-if="invDet.type==='invoice'" style="padding:8px 10px;border-bottom:1px solid var(--brd);text-align:right;font-family:var(--fm)" :style="{color:(item.pendingQty>0?'var(--org)':'var(--tx3)')}">{{item.pendingQty!==undefined?item.pendingQty:(item.qty-(item.deliveredQty||0))}}</td>

      </div>

  </div>
  </div>

      <div>
        <h3>{{showLivePreview?'🔍 Live Preview':'🖨 Preview / Print'}}</h3>

      <!-- Toolbar -->

          <option value="classic">Classic</option>

          <input type="checkbox" v-model="printShowTax"/> Show Tax Breakdown
        </label>
        <label style="font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" v-model="printShowNotes"/> Show Notes
        </label>

<!-- RECONCILIATION PAGE -->
<template v-if="pg==='recon'">
  <div class="topbar">
    <h2>Reconciliation</h2>
    <div class="tba">
      <select v-model="reconAccount" @change="loadReconLines();loadReconSummary()" class="fc" style="width:200px">
        <option value="">Select account…</option>
        <option v-for="a in baccs" :key="a._id" :value="a._id">{{a.name}}</option>
      </select>
      <button class="btn btn-p" @click="mReconImport=true" :disabled="!reconAccount">Import CSV</button>
    </div>
  </div>
  <div class="content">
    <!-- Summary bar -->
    <div class="sg" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px" v-if="reconAccount">
      <div class="sc g">
        <div class="sl">Book Balance</div>
        <div class="sv" :class="reconSummary.bookBalance>=0?'cg':'cr'">{{f(reconSummary.bookBalance||0)}}</div>
        <div class="ss">From bank account</div>
      </div>
      <div class="sc b">
        <div class="sl">Statement Balance</div>
        <div class="sv cb2" v-if="reconSummary.statementBalance!=null">{{f(reconSummary.statementBalance)}}</div>
        <div class="sv cm" v-else>No import yet</div>
        <div class="ss">Last imported line</div>
      </div>
      <div class="sc" :class="Math.abs(reconDifference)<0.01?'g':'r'">
        <div class="sl">Difference</div>
        <div class="sv" :class="Math.abs(reconDifference)<0.01?'cg':'cr'">{{reconSummary.statementBalance!=null?f(reconDifference):'—'}}</div>
        <div class="ss" :class="Math.abs(reconDifference)<0.01?'cg':''">{{Math.abs(reconDifference)<0.01?'Balanced!':'Confirm more matches'}}</div>
      </div>
    </div>

    <div v-if="!reconAccount" class="card" style="text-align:center;padding:48px">
      <div style="font-size:32px;margin-bottom:8px">✅</div>
      <div style="color:var(--tx2)">Select a bank account to start reconciling</div>
    </div>

    <template v-if="reconAccount">
      <!-- Tabs + status counts -->
      <div style="display:flex;gap:6px;margin-bottom:12px;align-items:center">
        <button class="btn btn-o btn-sm" :class="reconTab==='unreconciled'?'btn-p':''" @click="reconTab='unreconciled';loadReconLines()">
          Unreconciled <span v-if="reconSummary.statusCounts?.unreconciled" class="nbadge" style="position:static;margin-left:4px">{{reconSummary.statusCounts.unreconciled}}</span>
        </button>
        <button class="btn btn-o btn-sm" :class="reconTab==='reconciled'?'btn-p':''" @click="reconTab='reconciled';loadReconLines()">Reconciled</button>
        <button class="btn btn-o btn-sm" :class="reconTab==='ignored'?'btn-p':''" @click="reconTab='ignored';loadReconLines()">Ignored</button>
        <button class="btn btn-o btn-sm" @click="loadReconLines()" style="margin-left:auto">↻ Refresh</button>
      </div>

      <div class="card">
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th style="width:90px">Date</th>
                <th>Description</th>
                <th style="width:120px;text-align:right">Amount</th>
                <th v-if="reconTab==='unreconciled'" style="width:200px">Best Match</th>
                <th v-if="reconTab==='reconciled'" style="width:200px">Matched To</th>
                <th style="width:160px">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="reconLoading"><td colspan="5" class="emp">Loading…</td></tr>
              <tr v-else-if="!reconLines.length"><td colspan="5" class="emp"><div class="eic">✅</div><div>No {{reconTab}} lines</div></td></tr>
              <tr v-for="line in reconLines" :key="line._id">
                <td class="mn cm">{{fd(line.date)}}</td>
                <td>
                  <div style="font-weight:500;color:var(--txt);font-size:13px">{{line.note||line.description}}</div>
                  <div class="cm" style="font-size:10px" v-if="line.counterparty">{{line.counterparty}}</div>
                  <div class="cm" style="font-size:10px" v-if="line.reference">Ref: {{line.reference}}</div>
                </td>
                <td class="mn fw" style="text-align:right" :class="line.direction==='credit'?'cg':'cr'">
                  {{line.direction==='credit'?'+':'-'}}{{f(Math.abs(line.amount))}}
                </td>
                <!-- Unreconciled: show best suggestion inline -->
                <td v-if="reconTab==='unreconciled'">
                  <span v-if="line._bestSugg" class="badge" :class="line._bestSugg.band==='High'?'bpaid':line._bestSugg.band==='Medium'?'bpend':'bout'" style="font-size:10px">{{line._bestSugg.band}}</span>
                  <span v-if="line._bestSugg" style="font-size:11px;color:var(--txt);margin-left:4px">{{line._bestSugg.label}}</span>
                  <span v-if="!line._bestSugg" class="cm" style="font-size:11px">—</span>
                </td>
                <!-- Reconciled: show what it was matched to -->
                <td v-if="reconTab==='reconciled'">
                  <div v-for="m in (line.matches||[])" :key="m.label" style="font-size:11px;color:var(--txt)">
                    <span class="badge bpaid" style="font-size:9px;margin-right:3px">{{m.kind}}</span>{{m.label}} {{f(m.amount)}}
                  </div>
                </td>
                <!-- Actions -->
                <td>
                  <div class="fx g6" v-if="reconTab==='unreconciled'">
                    <button class="btn btn-o btn-sm" @click="openMatch(line)" title="View suggestions & match">Match</button>
                    <button class="btn btn-o btn-sm" @click="splitLine(line)" title="Split into invoice + extra">Split</button>
                    <button class="btn btn-o btn-sm" @click="bookBankOnly(line)" title="Book as bank fee or interest">Fee</button>
                    <button class="btn btn-sm" style="background:none;border:1px solid var(--brd);color:var(--tx3)" @click="ignoreLine(line)" title="Ignore this line">Ignore</button>
                  </div>
                  <div class="fx g6" v-else>
                    <button class="btn btn-o btn-sm" @click="undoReconcile(line)">Undo</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>
</template>
